name: Revenue readiness monitor

on:
  workflow_dispatch:
  schedule:
    # Daily at 06:47 UTC, away from the top of the hour.
    - cron: "47 6 * * *"
  push:
    paths:
      - "scripts/build_revenue_readiness_report.py"
      - "scripts/test_build_revenue_readiness_report.py"
      - "data/revenue-pipeline.json"
      - "data/financial-ledger.json"
      - "scripts/build_expense_guard_report.py"
      - "scripts/test_build_expense_guard_report.py"
      - "docs/expense-control-and-self-funding.md"
      - ".github/workflows/revenue-readiness.yml"
      - "docs/organizational-pilot-spec.md"
      - "docs/sample-organization-report-2026-11-20.md"
      - "docs/organizational-pilot-execution-checklist.md"
      - "docs/prospect-interview-guides.md"
      - "docs/payment-and-owner-payout-readiness.md"
      - "docs/first-paid-report-pilot.md"

permissions:
  contents: read

concurrency:
  group: global-support-radar-revenue-readiness
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test revenue readiness safeguards
        run: python -m unittest discover -s scripts -p 'test_build_revenue_readiness_report.py' -v
      - name: Generate conservative readiness report
        run: python scripts/build_revenue_readiness_report.py > revenue-readiness-report.md
      - name: Enforce zero-debt expense and cash guard
        run: |
          python -m unittest discover -s scripts -p 'test_build_expense_guard_report.py' -v
          python scripts/build_expense_guard_report.py > expense-guard-report.md
      - name: Preserve report as a private-to-run artifact
        uses: actions/upload-artifact@v4
        with:
          name: revenue-readiness-${{ github.run_number }}
          path: |\n            revenue-readiness-report.md\n            expense-guard-report.md
          if-no-files-found: error
          retention-days: 14
