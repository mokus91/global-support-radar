name: Quality Guardian - tests only

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */3 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/**"
      - "*.html"
      - "*.js"
      - "sitemap.xml"
      - "robots.txt"
      - "requirements-ci.txt"
      - ".github/workflows/quality-guardian.yml"

permissions:
  contents: read

concurrency:
  group: global-support-radar-quality-guardian
  cancel-in-progress: true

jobs:
  quality-check:
    name: Isolated quality and regression checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install locked test dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt
      - name: Compile all project scripts
        run: python -m compileall -q scripts
      - name: Validate sitemap, pages, and frontend
        run: python scripts/validate_project.py
      - name: Run offline data quality audit
        run: python scripts/check_beta_data_quality.py
      - name: Run all regression tests
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Save quality-check summary
        if: always()
        run: |
          {
            echo "# Quality Guardian"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
            echo "- This workflow is read-only; it does not change or publish website files."
            echo "- Review the job steps for the exact test result."
          } > quality-guardian-summary.md
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quality-guardian-${{ github.run_number }}
          path: quality-guardian-summary.md
          if-no-files-found: error
          retention-days: 30
