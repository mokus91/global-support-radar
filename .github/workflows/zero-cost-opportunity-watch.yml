name: Zero-cost revenue opportunity watch

on:
  workflow_dispatch:
  schedule:
    - cron: "23 7 * * 1"

permissions:
  contents: read

concurrency:
  group: gsr-zero-cost-opportunity-watch
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.5.0
        with:
          python-version: "3.12"
      - name: Check curated official opportunity and cost pages
        run: python scripts/check_revenue_opportunities.py
      - name: Save weekly report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: revenue-opportunity-watch-${{ github.run_number }}
          path: revenue-opportunity-watch.md
          if-no-files-found: error
          retention-days: 30
