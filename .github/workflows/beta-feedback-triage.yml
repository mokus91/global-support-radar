name: Triage beta feedback
on:
  issues:
    types: [opened, edited]
permissions:
  issues: write
  contents: read
concurrency:
  group: beta-feedback-triage-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  triage:
    if: contains(github.event.issue.labels.*.name, 'user-feedback') || contains(github.event.issue.title, '[Beta feedback]') || contains(github.event.issue.body, 'Feedback type:')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Classify and label feedback
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const issue = context.payload.issue;
            const body = (issue.body || '').toLowerCase();
            const title = (issue.title || '').toLowerCase();
            const labels = [
              {name:'user-feedback', color:'1D76DB', description:'Feedback submitted by website beta testers'},
              {name:'feedback-bug', color:'D73A4A', description:'Possible website malfunction reported by a tester'},
              {name:'feedback-data-quality', color:'FBCA04', description:'Potentially missing or inaccurate support data'},
              {name:'feedback-feature', color:'A2EEEF', description:'Feature idea or improvement suggestion'},
              {name:'feedback-usability', color:'C5DEF5', description:'Website usability or accessibility feedback'},
              {name:'priority-high', color:'B60205', description:'High-priority issue requiring prompt review'}
            ];
            for (const label of labels) {
              try {
                await github.rest.issues.getLabel({...context.repo, name:label.name});
              } catch (e) {
                if (e.status === 404) await github.rest.issues.createLabel({...context.repo, ...label});
                else throw e;
              }
            }
            const selected = new Set(['user-feedback']);
            if (/hibás működés|nem működik|hiba|broken|error|crash|cannot|can't/.test(body + ' ' + title)) selected.add('feedback-bug');
            if (/pontatlan|hiányzó adat|incorrect data|missing data|inaccurate/.test(body)) selected.add('feedback-data-quality');
            if (/ötlet|fejlesztési javaslat|feature|suggestion|would like/.test(body)) selected.add('feedback-feature');
            if (/használhatóság|akadálymentesség|nehezen|confusing|usability|accessibility/.test(body)) selected.add('feedback-usability');
            if (/összeomlik|adatvesztés|security vulnerability|biztonsági sérülékenység/.test(body + ' ' + title)) selected.add('priority-high');
            await github.rest.issues.addLabels({...context.repo, issue_number:issue.number, labels:[...selected]});
            core.info('Applied feedback labels: ' + [...selected].join(', '));
