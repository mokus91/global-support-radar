name: Continuous improvement loop

on:
  workflow_dispatch:
  schedule:
    # Daily, away from the top of the hour to reduce queue delays.
    - cron: "13 5 * * *"
  push:
    paths:
      - "scripts/generate_improvement_backlog.py"
      - "scripts/generate_organization_report.py"
      - "scripts/validate_project.py"
      - "scripts/audit_opportunity_quality.py"
      - "scripts/test_*.py"
      - ".github/workflows/continuous-improvement.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: global-support-radar-continuous-improvement
  cancel-in-progress: false

jobs:
  inspect-and-propose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5.5.0
        with:
          python-version: "3.12"
      - name: Install pinned CI dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt
      - name: Compile all project scripts
        run: python -m compileall -q scripts
      - name: Validate project data and frontend
        run: python scripts/validate_project.py
      - name: Run adapter regression tests
        run: |
          python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Build evidence-based improvement backlog
        run: python scripts/generate_improvement_backlog.py > /tmp/global-support-radar-improvements.md
      - name: Publish or update improvement backlog issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const title = 'Folyamatos fejlesztési javaslatok — automatikus ellenőrzés';
            const report = fs.readFileSync('/tmp/global-support-radar-improvements.md', 'utf8');
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = report + '\n\n---\nAutomatikus ellenőrzés: ' + runUrl +
              '\nA javaslatok nem hajtanak végre kódmódosítást. A fejlesztések külön felülvizsgálatot és tesztet igényelnek.';
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const issue = existing.data.find(item => item.title === title);
            if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
