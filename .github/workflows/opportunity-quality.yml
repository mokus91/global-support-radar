name: Opportunity data quality audit

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/audit_opportunity_quality.py"
      - "scripts/track_opportunity_changes.py"
      - "data/feed-status.json"
      - "data/opportunity-changes.json"
      - ".github/workflows/opportunity-quality.yml"
  schedule:
    - cron: "41 */6 * * *"

permissions:
  contents: write

concurrency:
  group: opportunity-quality-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit feed records
        run: python scripts/audit_opportunity_quality.py
      - name: Publish aggregate quality report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'data/quality-report.json';
            const content = fs.readFileSync(path, 'utf8');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner: context.repo.owner, repo: context.repo.repo, path});
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo, path,
              message: 'Publish automated opportunity data quality report',
              content: Buffer.from(content).toString('base64'),
              ...(sha ? {sha} : {})
            });
