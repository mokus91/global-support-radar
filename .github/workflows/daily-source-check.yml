name: Daily official source monitoring

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-source-monitoring
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate catalogue JSON
        run: python -m json.tool data/worldwide-national-support-sources.json > /dev/null
      - name: Check official source URLs and content review dates
        run: python scripts/check_sources.py
      - name: Publish monitoring report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-health-report.json
          if git diff --cached --quiet; then
            echo "Monitoring report unchanged."
          else
            git commit -m "Update daily official source monitoring report"
            git push
          fi
