name: Automated organization report production

on:
  push:
    branches: [main]
    paths:
      - 'config/report-profiles.json'
      - 'scripts/build_report_portfolio.py'
      - 'scripts/generate_organization_report.py'
      - 'scripts/test_build_report_portfolio.py'
      - 'scripts/validate_sitemap.py'
      - 'scripts/test_validate_sitemap.py'
      - 'scripts/validate_project.py'
      - 'sitemap.xml'
      - 'scripts/test_generate_organization_report.py'
      - '.github/workflows/organization-report-production.yml'
  workflow_dispatch:
  schedule:
    # Daily report build, outside the busy hour boundary.
    - cron: "37 3 * * *"
  workflow_run:
    workflows:
      - Official source discovery and global country expansion
    types: [completed]

permissions:
  contents: read

concurrency:
  group: global-support-radar-organization-report
  cancel-in-progress: false

jobs:
  build-report:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.5.0
        with:
          python-version: "3.12"
      - name: Install pinned CI dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt
      - name: Test sitemap validator
        run: python -m unittest discover -s scripts -p 'test_validate_sitemap.py' -v
      - name: Validate current data, frontend, and sitemap
        run: python scripts/validate_project.py
      - name: Run report generator regression tests
        run: python -m unittest discover -s scripts -p 'test_generate_organization_report.py' -v
      - name: Test report portfolio generator
        run: python -m unittest discover -s scripts -p 'test_build_report_portfolio.py' -v
      - name: Generate latest organization monitoring report
        run: python scripts/generate_organization_report.py --output reports/organization-report-latest.md
      - name: Test opportunity change digest
        run: python -m unittest discover -s scripts -p 'test_build_opportunity_change_digest.py' -v
      - name: Generate opportunity change digest
        run: python scripts/build_opportunity_change_digest.py --input data/opportunity-changes.json --output reports/opportunity-change-digest.md
      - name: Generate configured profile reports
        run: python scripts/build_report_portfolio.py --config config/report-profiles.json --output-dir reports/profiles
      - name: Preserve generated reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: organization-monitoring-report-${{ github.run_number }}
          path: |
            reports/organization-report-latest.md
            reports/profiles/*.md
            reports/opportunity-change-digest.md
          if-no-files-found: error
          retention-days: 14
