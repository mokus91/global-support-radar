name: Published site health monitor

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/site-health.yml"
      - "scripts/check_published_site.py"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: published-site-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check published homepage, feed freshness and public JSON feeds
        run: >-
          python scripts/check_published_site.py
          --base-url https://mokus91.github.io/global-support-radar/
          --max-age-hours 30

      - name: Open or update a health alert issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Automatikus rendszerfelügyeleti riasztás';
            const label = 'automated-health-alert';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'A Global Support Radar automatikus állapotellenőrzése hibát talált.',
              '',
              `- Workflow-futás: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Időpont (UTC): ${new Date().toISOString()}`,
              '',
              'A részletes hiba a fenti futás naplójában található. Az issue automatikusan frissül, amíg a hiba fennáll.'
            ].join('\\n');
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 100 });
            if (existing.data.length) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
            }
