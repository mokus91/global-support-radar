name: Published site health monitor

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/site-health.yml"
      - "scripts/check_published_site.py"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: published-site-health
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.5.0
        with:
          python-version: "3.12"
      - name: Check published homepage, feed freshness and public JSON feeds
        run: >-
          python scripts/check_published_site.py
          --base-url https://mokus91.github.io/global-support-radar/
          --max-age-hours 30

      - name: Open or update a health alert issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Automatikus rendszerfelügyeleti riasztás';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'A Global Support Radar automatikus állapotellenőrzése hibát talált.',
              '',
              `- Workflow-futás: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Időpont (UTC): ${new Date().toISOString()}`,
              '',
              'A részletes hiba a fenti futás naplójában található. Az issue automatikusan frissül, amíg a hiba fennáll.'
            ].join('\\n');
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const alert = existing.data.find(issue => issue.title === title);
            if (alert) {
              await github.rest.issues.update({ owner, repo, issue_number: alert.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
