name: Official source discovery

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/source-discovery.yml"
      - "scripts/**"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: official-source-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON data and frontend JavaScript
        run: python scripts/validate_project.py
      - name: Compile Python discovery adapters
        run: python -m compileall -q scripts
      - name: Install trusted certificate bundle
        run: python -m pip install --disable-pip-version-check certifi
      - name: Discover EU public datasets
        run: python scripts/discover_sources.py
      - name: Discover EU Funding and Tenders calls
        run: python scripts/discover_eu_funding.py
      - name: Discover US Grants.gov opportunities
        run: python scripts/discover_us_grants.py
      - name: Discover UKRI funding opportunities
        run: python scripts/discover_ukri.py
      - name: Discover Australian ARC research grants
        run: python scripts/discover_au_arc_grants.py
      - name: Discover Canadian CIHR funding opportunities
        run: python scripts/discover_ca_cihr.py
      - name: Discover Hungarian open-data datasets
        run: python scripts/discover_hu_open_data.py
      - name: Probe official Hungarian grant announcements feed
        run: python scripts/discover_hu_palyazat_feed.py
      - name: Commit discovery indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/gsr-discovery
          cp data/discovery-index.json data/eu-funding-discovery.json data/eu-open-calls-discovery.json data/us-grants-discovery.json data/ukri-discovery.json data/au-arc-grants-discovery.json data/ca-cihr-discovery.json data/hu-open-data-discovery.json data/hu-palyazat-announcements.json /tmp/gsr-discovery/
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/gsr-discovery/*.json data/
          git add data/discovery-index.json data/eu-funding-discovery.json data/eu-open-calls-discovery.json data/us-grants-discovery.json data/ukri-discovery.json data/au-arc-grants-discovery.json data/ca-cihr-discovery.json data/hu-open-data-discovery.json data/hu-palyazat-announcements.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official source discovery index"
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Push attempt $attempt failed; retrying after refreshing main."
              sleep $((attempt * 3))
            done
            if [ "$pushed" != "true" ]; then
              echo "Could not push discovery update after 5 attempts."
              exit 1
            fi
          else
            echo "No discovery changes."
          fi
