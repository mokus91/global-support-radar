name: Official source discovery and global country expansion

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/source-discovery.yml"
      - "scripts/**"
      - "requirements-ci.txt"
  schedule:
    - cron: "23 1,7,13,19 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: official-source-discovery-v2
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.5.0
        with:
          python-version: "3.12"
      - name: Compile Python discovery adapters
        run: python -m compileall -q scripts
      - name: Install trusted certificate bundle and ISO country lookup
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt
      - name: Test CIHR official-notice parsing and status safeguards
        run: python -m unittest discover -s scripts -p 'test_discover_ca_cihr.py' -v
      - name: Test French eligibility verification safeguards
        run: python -m unittest discover -s scripts -p 'test_discover_france_aides_territoires.py' -v
      - name: Build UN DESA national portal directory for 193 Member States
        run: python scripts/build_un_national_portals.py
      - name: Expand country navigator with historical UN portal leads
        run: python scripts/expand_global_country_portals.py
      - name: Validate JSON data and frontend JavaScript
        run: python scripts/validate_project.py
      - name: Check reachability of official national support portals
        run: python scripts/check_worldwide_portals.py
      - name: Discover EU public datasets
        run: python scripts/discover_sources.py
      - name: Discover live Japanese government subsidies from JGrants API
        run: python scripts/discover_jgrants.py
      - name: Discover current Chilean CORFO calls from official pages
        run: python scripts/discover_chile_calls.py
      - name: Discover Spanish national and regional grant calls from SNPSAP API
        run: python scripts/discover_spain_grants.py
      - name: Discover French local public aid schemes from Aides-territoires API
        run: python scripts/discover_france_aides_territoires.py
      - name: Discover EU Funding and Tenders calls
        run: python scripts/discover_eu_funding.py
      - name: Discover EU CAP Network agriculture funding calls
        run: python scripts/discover_eu_cap_calls.py
      - name: Discover agriculture links on 27 EU national funding portals
        timeout-minutes: 8
        run: python scripts/discover_eu_national_agriculture.py
      - name: Discover business, housing, energy, education, employment and transport links
        timeout-minutes: 8
        run: python scripts/discover_eu_national_categories.py
      - name: Discover US Grants.gov opportunities
        timeout-minutes: 8
        run: python scripts/discover_us_grants.py
      - name: Discover UKRI funding opportunities
        run: python scripts/discover_ukri.py
      - name: Discover Australian ARC research grants
        timeout-minutes: 8
        run: python scripts/discover_au_arc_grants.py
      - name: Discover New Zealand Government Funding Explorer listings
        run: python scripts/discover_nz_funding_explorer.py
      - name: Discover Canadian CIHR RSS and official upcoming-opportunity notices
        timeout-minutes: 5
        run: python scripts/discover_ca_cihr.py
      - name: Discover Hungarian open-data datasets
        run: python scripts/discover_hu_open_data.py
      - name: Probe official Hungarian grant announcements feed
        run: python scripts/discover_hu_palyazat_feed.py
      - name: Test NKFIH retry and snapshot safeguards
        run: python -m unittest discover -s scripts -p 'test_discover_hu_nkfih.py' -v
      - name: Discover Hungarian NKFIH grant news from official RSS
        run: python scripts/discover_hu_nkfih.py
      - name: Rebuild country pages from the latest official-source indexes
        run: python scripts/build_country_pages.py
      - name: Build Hungarian support and family-benefit SEO pages
        run: python scripts/build_hu_support_pages.py
      - name: Build Japanese-language SEO pages for current JGrants programmes
        run: python scripts/build_jgrants_pages.py
      - name: Build German-language official support and benefit directory
        run: python scripts/build_de_support_pages.py
      - name: Build Italian-language official benefits and incentives directory
        run: python scripts/build_it_support_pages.py
      - name: Build Dutch-language official support directory
        run: python scripts/build_localized_support_pages.py nl
      - name: Build Polish-language official support directory
        run: python scripts/build_localized_support_pages.py pl
      - name: Build Austrian German-language official support directory
        run: python scripts/build_localized_support_pages.py de
      - name: Build Swedish-language official support directory
        run: python scripts/build_localized_support_pages.py sv
      - name: Build Finnish-language official support directory
        run: python scripts/build_nordic_ie_pages.py fi
      - name: Build Danish-language official support directory
        run: python scripts/build_nordic_ie_pages.py da
      - name: Build Norwegian-language official support directory
        run: python scripts/build_nordic_ie_pages.py no
      - name: Build English-language Ireland support directory
        run: python scripts/build_nordic_ie_pages.py ie
      - name: Validate refreshed discovery outputs
        run: python scripts/validate_discovery_outputs.py
      - name: Build feed freshness and result-status manifest
        run: python scripts/build_feed_status.py
      - name: Track new and changed opportunities against the previous snapshot
        run: python scripts/track_opportunity_changes.py
      - name: Regenerate quality report from the newly refreshed feeds
        run: python scripts/audit_opportunity_quality.py
      - name: Validate the generated feed status manifest
        run: python scripts/validate_discovery_outputs.py
      - name: Validate all refreshed JSON and website assets
        run: python scripts/validate_project.py
      - name: Commit discovery indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/gsr-discovery
          mkdir -p /tmp/gsr-country-pages
          cp -a countries/. /tmp/gsr-country-pages/
          cp sitemap.xml /tmp/gsr-discovery-sitemap.xml
          cp data/discovery-index.json data/eu-funding-discovery.json data/eu-open-calls-discovery.json data/eu-cap-network-discovery.json data/eu-national-agriculture-discovery.json data/eu-national-category-discovery.json data/us-grants-discovery.json data/ukri-discovery.json data/au-arc-grants-discovery.json data/ca-cihr-discovery.json data/hu-open-data-discovery.json data/hu-palyazat-announcements.json data/hu-nkfih-discovery.json data/un-national-portals.json data/jgrants-discovery.json data/chile-discovery.json data/spain-discovery.json data/france-aides-territoires-discovery.json data/nz-funding-explorer-discovery.json data/worldwide-portal-health.json data/feed-status.json data/opportunity-changes.json data/quality-report.json /tmp/gsr-discovery/
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/gsr-discovery/*.json data/
          cp -a /tmp/gsr-country-pages/. countries/
          cp /tmp/gsr-discovery-sitemap.xml sitemap.xml
          git add countries sitemap.xml data/discovery-index.json data/eu-funding-discovery.json data/eu-open-calls-discovery.json data/eu-cap-network-discovery.json data/eu-national-agriculture-discovery.json data/eu-national-category-discovery.json data/us-grants-discovery.json data/ukri-discovery.json data/au-arc-grants-discovery.json data/ca-cihr-discovery.json data/hu-open-data-discovery.json data/hu-palyazat-announcements.json data/hu-nkfih-discovery.json data/un-national-portals.json data/jgrants-discovery.json data/chile-discovery.json data/spain-discovery.json data/france-aides-territoires-discovery.json data/nz-funding-explorer-discovery.json data/worldwide-portal-health.json data/feed-status.json data/opportunity-changes.json data/quality-report.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official source discovery index"
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              echo "Push attempt $attempt failed; retrying after refreshing main."
              sleep $((attempt * 3))
            done
            if [ "$pushed" != "true" ]; then
              echo "Could not push discovery update after 5 attempts."
              exit 1
            fi
          else
            echo "No discovery changes."
          fi

      - name: Open or update a discovery failure alert
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const title = 'Global Support Radar adatgyűjtési hiba';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'A Global Support Radar hivatalos adatforrásokat feldolgozó automatikus futása hibával leállt.',
              '',
              `- Workflow-futás: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Időpont (UTC): ${new Date().toISOString()}`,
              '',
              'A részletes hiba a futás naplójában található. A következő ütemezett futás újra megpróbálja az adatgyűjtést.'
            ].join('\n');
            const { owner, repo } = context.repo;
            const existing = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const alert = existing.data.find(issue => issue.title === title);
            if (alert) {
              await github.rest.issues.update({ owner, repo, issue_number: alert.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body });
            }
