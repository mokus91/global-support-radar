name: Official source discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Discover EU public datasets
        run: python scripts/discover_sources.py
      - name: Commit discovery index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discovery-index.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh official source discovery index"
            git push
          else
            echo "No discovery changes."
          fi
